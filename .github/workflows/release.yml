# ==============================================================================
# GitHub Actions Workflow for Flutter Desktop Releases (Windows, macOS, Linux)
# Target Platforms: Windows (x64), Linux (x64), macOS (Universal)
# ==============================================================================

name: Build and Release Flutter Desktop

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with 'v' (e.g. v0.5.0.Beta)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Force GitHub Actions runners to execute JavaScript actions using Node 24 runtime
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

  build:
    name: Build on ${{ matrix.os-name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            target: windows
          - os: macos-latest
            os-name: macOS
            target: macos
          - os: ubuntu-latest
            os-name: Linux
            target: linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "${{ github.event.repository.name }}_windows_x64.zip"

      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          tar -czvf "${{ github.event.repository.name }}_linux_x64.tar.gz" -C build/linux/x64/release/bundle .

      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/${{ github.event.repository.name }}_macos.zip" *.app

      - name: Stash build asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-asset
          path: |
            *windows*.zip
            *linux*.tar.gz
            *macos*.zip

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build assets
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ### Note on Windows / macOS Security Prompts
            These tools are free and independent projects and are not yet code-signed with commercial certificates:
            - **Windows**: If SmartScreen appears, click "More info" → "Run anyway".
            - **macOS**: Right-click the `.app` file, select Open, and confirm the prompt (or run `xattr -c <AppName>.app` in Terminal).
